<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Agent UI 设计闭环</title>
<desc id="desc">Agent UI 设计闭环 的视觉示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset="1" stop-color="#54D2C6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1280" height="800" rx="32" fill="url(#bg)"/>

<text x="70" y="92" fill="#F7F8FF" font-size="44" font-family="Inter,Arial,sans-serif" font-weight="800">Agent UI 设计闭环</text>
<text x="70" y="133" fill="#AAB3D1" font-size="22" font-family="Inter,Arial,sans-serif">设计不是生成一次，而是持续缩小意图与实现的差距</text>
<g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">
  <g transform="translate(90 260)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">产品 Brief</text></g>
  <g transform="translate(350 140)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">灰度结构</text></g>
  <g transform="translate(640 110)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">视觉方向</text></g>
  <g transform="translate(920 180)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">组件与状态</text></g>
  <g transform="translate(1010 410)"><rect width="190" height="92" rx="22" fill="url(#accent)"/><text x="95" y="55" text-anchor="middle" fill="#06121C">Agent 实现</text></g>
  <g transform="translate(770 610)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">截图对比</text></g>
  <g transform="translate(450 640)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">问题分级</text></g>
  <g transform="translate(150 520)"><rect width="190" height="92" rx="22" fill="#202A4D"/><text x="95" y="55" text-anchor="middle" fill="#E9ECFF">下一轮修改</text></g>
</g>
<g stroke="#64719B" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M280 285 C310 230 325 205 350 190"/><path d="M540 175 C575 145 600 138 640 145"/><path d="M830 160 C875 165 900 190 920 210"/><path d="M1080 272 C1140 315 1150 365 1120 410"/><path d="M1010 500 C950 565 920 590 900 610"/><path d="M770 665 C720 690 690 690 640 685"/><path d="M450 675 C380 650 330 620 310 602"/><path d="M175 520 C100 470 75 390 100 350"/>
</g>

</svg>
