<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">Design System 五层结构</title>
<desc id="desc">Design System 五层结构 的视觉示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset="1" stop-color="#54D2C6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1280" height="860" rx="32" fill="url(#bg)"/>

<text x="70" y="80" fill="#F7F8FF" font-size="42" font-family="Inter,Arial,sans-serif" font-weight="800">Design System 的五层结构</text>
<g transform="translate(120 150)" font-family="Inter,Arial,sans-serif" font-weight="700">
  <rect x="0" y="500" width="1040" height="110" rx="22" fill="#1D2748"/><text x="520" y="566" text-anchor="middle" fill="#DCE2FF" font-size="25">Governance · 文档、约束、责任与演进机制</text>
  <rect x="70" y="385" width="900" height="95" rx="22" fill="#26335D"/><text x="520" y="443" text-anchor="middle" fill="#DCE2FF" font-size="24">Patterns · 表单、筛选、导航、确认、错误恢复</text>
  <rect x="150" y="275" width="740" height="90" rx="22" fill="#334173"/><text x="520" y="331" text-anchor="middle" fill="#E6EAFF" font-size="24">Components · Button、Input、Card、Modal</text>
  <rect x="235" y="170" width="570" height="85" rx="22" fill="#46578D"/><text x="520" y="223" text-anchor="middle" fill="#F0F2FF" font-size="23">Foundations · Typography、Grid、Motion</text>
  <rect x="320" y="70" width="400" height="80" rx="22" fill="url(#accent)"/><text x="520" y="121" text-anchor="middle" fill="#07111B" font-size="23">Tokens · Color、Spacing、Radius</text>
</g>
<text x="640" y="805" text-anchor="middle" fill="#9DA8C8" font-size="20" font-family="Inter,Arial,sans-serif">组件库只是其中一层；真正的系统还需要模式、规则与治理</text>

</svg>
