<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" role="img" aria-labelledby="title desc">
<title id="title">8 周学习路线图</title>
<desc id="desc">8 周学习路线图 的视觉示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset="1" stop-color="#54D2C6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1300" height="800" rx="32" fill="url(#bg)"/>

<text x="70" y="75" fill="#F7F8FF" font-size="42" font-family="Inter,Arial,sans-serif" font-weight="800">8 周：从看懂术语到设计—代码闭环</text>
<g transform="translate(70 130)" font-family="Inter,Arial,sans-serif">
  <path d="M70 90 H1130" stroke="#39466F" stroke-width="8" stroke-linecap="round"/>
  <g font-weight="800" text-anchor="middle">
    <g transform="translate(70 90)"><circle r="32" fill="#7C8CFF"/><text y="8" fill="#07111B" font-size="22">1</text><text y="78" fill="#E8EBFF" font-size="19">Pencil 基础</text></g>
    <g transform="translate(220 90)"><circle r="32" fill="#7C8CFF"/><text y="8" fill="#07111B" font-size="22">2</text><text y="78" fill="#E8EBFF" font-size="19">页面结构</text></g>
    <g transform="translate(370 90)"><circle r="32" fill="#7C8CFF"/><text y="8" fill="#07111B" font-size="22">3</text><text y="78" fill="#E8EBFF" font-size="19">视觉层级</text></g>
    <g transform="translate(520 90)"><circle r="32" fill="#7C8CFF"/><text y="8" fill="#07111B" font-size="22">4</text><text y="78" fill="#E8EBFF" font-size="19">视觉身份</text></g>
    <g transform="translate(670 90)"><circle r="32" fill="#54D2C6"/><text y="8" fill="#07111B" font-size="22">5</text><text y="78" fill="#E8EBFF" font-size="19">组件系统</text></g>
    <g transform="translate(820 90)"><circle r="32" fill="#54D2C6"/><text y="8" fill="#07111B" font-size="22">6</text><text y="78" fill="#E8EBFF" font-size="19">流程状态</text></g>
    <g transform="translate(970 90)"><circle r="32" fill="#54D2C6"/><text y="8" fill="#07111B" font-size="22">7</text><text y="78" fill="#E8EBFF" font-size="19">响应无障碍</text></g>
    <g transform="translate(1130 90)"><circle r="38" fill="url(#accent)"/><text y="8" fill="#07111B" font-size="22">8</text><text y="78" fill="#F7F8FF" font-size="19">综合交付</text></g>
  </g>
  <g transform="translate(0 240)">
    <rect width="1160" height="310" rx="26" fill="#10162B" stroke="#2B355B"/>
    <text x="40" y="60" fill="#9DA8FF" font-size="24" font-weight="800">每周固定循环</text>
    <g transform="translate(55 105)" font-size="21" font-weight="700" text-anchor="middle">
      <rect width="185" height="70" rx="18" fill="#202A4D"/><text x="92" y="44" fill="#E9ECFF">学习 1 个概念</text>
      <rect x="220" width="185" height="70" rx="18" fill="#202A4D"/><text x="312" y="44" fill="#E9ECFF">拆 3 个案例</text>
      <rect x="440" width="185" height="70" rx="18" fill="#202A4D"/><text x="532" y="44" fill="#E9ECFF">生成 3 个方向</text>
      <rect x="660" width="185" height="70" rx="18" fill="#202A4D"/><text x="752" y="44" fill="#E9ECFF">选择并精修</text>
      <rect x="880" width="185" height="70" rx="18" fill="url(#accent)"/><text x="972" y="44" fill="#07111B">截图 Review</text>
    </g>
    <text x="580" y="245" text-anchor="middle" fill="#ABB5D3" font-size="22">每天 45–60 分钟：15 分钟概念 + 30 分钟实践 + 10 分钟复盘</text>
  </g>
</g>

</svg>
