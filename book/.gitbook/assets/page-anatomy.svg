<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">Landing Page 页面解剖</title>
<desc id="desc">Landing Page 页面解剖 的视觉示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset="1" stop-color="#54D2C6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1280" height="860" rx="32" fill="url(#bg)"/>

<text x="70" y="80" fill="#F7F8FF" font-size="42" font-family="Inter,Arial,sans-serif" font-weight="800">Landing Page 页面解剖</text>
<g transform="translate(70 125)" font-family="Inter,Arial,sans-serif">
  <rect width="760" height="690" rx="24" fill="#F5F7FC"/>
  <rect x="30" y="25" width="700" height="58" rx="14" fill="#E3E7F3"/>
  <text x="380" y="62" text-anchor="middle" fill="#39415C" font-size="20" font-weight="700">Navbar：告诉用户能去哪里</text>
  <rect x="30" y="105" width="700" height="190" rx="18" fill="#DDE3FF"/>
  <text x="380" y="165" text-anchor="middle" fill="#26305A" font-size="30" font-weight="800">Hero：一句话解释价值</text>
  <text x="380" y="205" text-anchor="middle" fill="#536088" font-size="18">Headline · Subheadline · CTA · Product proof</text>
  <rect x="275" y="235" width="210" height="42" rx="12" fill="#7C8CFF"/>
  <text x="380" y="263" text-anchor="middle" fill="#07111B" font-size="17" font-weight="800">Primary CTA</text>
  <rect x="30" y="315" width="700" height="95" rx="18" fill="#E7F6F3"/>
  <text x="380" y="370" text-anchor="middle" fill="#21554E" font-size="22" font-weight="700">Social proof：证明不是自说自话</text>
  <rect x="30" y="430" width="220" height="130" rx="18" fill="#EAEDF6"/><rect x="270" y="430" width="220" height="130" rx="18" fill="#EAEDF6"/><rect x="510" y="430" width="220" height="130" rx="18" fill="#EAEDF6"/>
  <text x="380" y="500" text-anchor="middle" fill="#39415C" font-size="22" font-weight="700">Features：能力与收益</text>
  <rect x="30" y="580" width="700" height="78" rx="18" fill="#FFF1D7"/>
  <text x="380" y="628" text-anchor="middle" fill="#6B4B16" font-size="22" font-weight="700">Final CTA：在疑虑被处理后推动行动</text>
</g>
<g transform="translate(890 165)" font-family="Inter,Arial,sans-serif">
  <text fill="#9DA8FF" font-size="24" font-weight="800">阅读顺序</text>
  <g transform="translate(0 55)">
    <circle cx="28" cy="28" r="28" fill="#7C8CFF"/><text x="28" y="36" text-anchor="middle" fill="#07111B" font-size="22" font-weight="800">1</text><text x="78" y="36" fill="#F7F8FF" font-size="22">我在哪里？</text>
    <circle cx="28" cy="118" r="28" fill="#7C8CFF"/><text x="28" y="126" text-anchor="middle" fill="#07111B" font-size="22" font-weight="800">2</text><text x="78" y="126" fill="#F7F8FF" font-size="22">这是什么？</text>
    <circle cx="28" cy="208" r="28" fill="#7C8CFF"/><text x="28" y="216" text-anchor="middle" fill="#07111B" font-size="22" font-weight="800">3</text><text x="78" y="216" fill="#F7F8FF" font-size="22">为什么相信？</text>
    <circle cx="28" cy="298" r="28" fill="#7C8CFF"/><text x="28" y="306" text-anchor="middle" fill="#07111B" font-size="22" font-weight="800">4</text><text x="78" y="306" fill="#F7F8FF" font-size="22">能解决什么？</text>
    <circle cx="28" cy="388" r="28" fill="#54D2C6"/><text x="28" y="396" text-anchor="middle" fill="#07111B" font-size="22" font-weight="800">5</text><text x="78" y="396" fill="#F7F8FF" font-size="22">下一步做什么？</text>
  </g>
</g>

</svg>
