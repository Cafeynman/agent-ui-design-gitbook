<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">响应式重新编排</title>
<desc id="desc">响应式重新编排 的视觉示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset="1" stop-color="#54D2C6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1400" height="760" rx="32" fill="url(#bg)"/>

<text x="70" y="80" fill="#F7F8FF" font-size="42" font-family="Inter,Arial,sans-serif" font-weight="800">响应式不是缩小，而是重新编排</text>
<g transform="translate(65 140)" font-family="Inter,Arial,sans-serif">
  <g><rect width="520" height="540" rx="24" fill="#F7F8FC"/><text x="260" y="-18" text-anchor="middle" fill="#9DA8FF" font-size="23" font-weight="800">Desktop · 1440</text>
  <rect x="28" y="28" width="464" height="44" rx="12" fill="#E4E7F1"/>
  <rect x="28" y="100" width="270" height="170" rx="18" fill="#DDE3FF"/><rect x="320" y="100" width="172" height="170" rx="18" fill="#E8EBF3"/>
  <rect x="28" y="300" width="142" height="150" rx="18" fill="#E8EBF3"/><rect x="189" y="300" width="142" height="150" rx="18" fill="#E8EBF3"/><rect x="350" y="300" width="142" height="150" rx="18" fill="#E8EBF3"/>
  <text x="260" y="500" text-anchor="middle" fill="#68728F" font-size="18">并排、信息密度较高</text></g>
  <g transform="translate(625 0)"><rect width="300" height="540" rx="30" fill="#F7F8FC"/><text x="150" y="-18" text-anchor="middle" fill="#9DA8FF" font-size="23" font-weight="800">Mobile · 390</text>
  <rect x="24" y="25" width="252" height="48" rx="12" fill="#E4E7F1"/>
  <rect x="24" y="98" width="252" height="150" rx="18" fill="#DDE3FF"/>
  <rect x="24" y="270" width="252" height="72" rx="16" fill="#E8EBF3"/>
  <rect x="24" y="359" width="252" height="72" rx="16" fill="#E8EBF3"/>
  <rect x="24" y="448" width="252" height="50" rx="14" fill="#7C8CFF"/>
  <text x="150" y="526" text-anchor="middle" fill="#68728F" font-size="16">排序、折叠、强化主行动</text></g>
  <g transform="translate(980 80)" fill="#F7F8FF" font-size="22"><text x="0" y="0" fill="#54D2C6" font-weight="800">需要重新决定：</text><text x="0" y="55">• 导航如何折叠</text><text x="0" y="100">• 网格如何变列</text><text x="0" y="145">• 内容顺序是否变化</text><text x="0" y="190">• 表格如何呈现</text><text x="0" y="235">• CTA 是否仍可触达</text><text x="0" y="280">• 触控目标是否足够</text></g>
</g>

</svg>
