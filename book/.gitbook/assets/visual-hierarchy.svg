<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">视觉层级对比</title>
<desc id="desc">视觉层级对比 的视觉示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151B35"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C8CFF"/><stop offset="1" stop-color="#54D2C6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1280" height="800" rx="32" fill="url(#bg)"/>

<text x="70" y="80" fill="#F7F8FF" font-size="42" font-family="Inter,Arial,sans-serif" font-weight="800">视觉层级：不是装饰，而是阅读顺序</text>
<g font-family="Inter,Arial,sans-serif" transform="translate(70 130)">
  <text x="260" y="0" text-anchor="middle" fill="#FFB6B6" font-size="24" font-weight="800">层级混乱</text>
  <rect y="25" width="520" height="560" rx="24" fill="#F7F8FC"/>
  <rect x="35" y="65" width="450" height="50" rx="10" fill="#DDE1ED"/>
  <text x="260" y="99" text-anchor="middle" fill="#30384F" font-size="22" font-weight="700">Everything has similar weight</text>
  <rect x="35" y="140" width="450" height="62" rx="12" fill="#8290FF"/>
  <text x="260" y="179" text-anchor="middle" fill="#10152C" font-size="22" font-weight="800">Secondary message</text>
  <rect x="35" y="225" width="215" height="110" rx="16" fill="#C9CEE0"/><rect x="270" y="225" width="215" height="110" rx="16" fill="#C9CEE0"/>
  <rect x="35" y="360" width="450" height="66" rx="14" fill="#8290FF"/>
  <rect x="35" y="452" width="450" height="66" rx="14" fill="#8290FF"/>
  <text x="260" y="552" text-anchor="middle" fill="#7C849F" font-size="18">用户不知道先看哪里</text>

  <text x="870" y="0" text-anchor="middle" fill="#8DE1D4" font-size="24" font-weight="800">层级清晰</text>
  <rect x="610" y="25" width="520" height="560" rx="24" fill="#F7F8FC"/>
  <text x="650" y="100" fill="#252C44" font-size="44" font-weight="850">One clear thesis.</text>
  <text x="650" y="145" fill="#6E7897" font-size="19">Supporting copy is quieter and easier to scan.</text>
  <rect x="650" y="180" width="160" height="52" rx="14" fill="#6677FF"/>
  <text x="730" y="213" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800">Primary action</text>
  <rect x="840" y="185" width="120" height="42" rx="12" fill="#E5E8F2"/>
  <text x="900" y="212" text-anchor="middle" fill="#4A536E" font-size="16" font-weight="700">Secondary</text>
  <rect x="650" y="285" width="440" height="205" rx="18" fill="#E8EBF5"/>
  <path d="M690 440 C760 325,830 420,930 320 S1035 365,1060 310" fill="none" stroke="#6677FF" stroke-width="10" stroke-linecap="round"/>
  <text x="870" y="552" text-anchor="middle" fill="#6E7897" font-size="18">标题 → 解释 → 行动 → 证据</text>
</g>

</svg>
