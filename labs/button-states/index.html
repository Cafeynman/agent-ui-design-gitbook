<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按钮必须在鼠标、键盘、等待和不可用情境下都给出清楚反馈。"><title>Button States · Agent UI Lab</title><style>
:root{--bg:#0b1020;--panel:#141b31;--panel2:#1c2542;--text:#f4f6ff;--muted:#a8b1cc;--line:#33405f;--accent:#7c8cff;--accent2:#54d2c6;--danger:#ff7d8d;--warning:#ffc66d;--success:#63d69b;--radius:20px;--shadow:0 22px 70px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(124,140,255,.2),transparent 32%),radial-gradient(circle at 90% 20%,rgba(84,210,198,.12),transparent 30%),var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:34px 0 70px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.brand{font-weight:850;letter-spacing:-.03em}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--text)}.eyebrow{color:var(--accent2);font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1;letter-spacing:-.055em;margin:.35rem 0 1rem;max-width:900px}.intro p{color:var(--muted);font-size:1.05rem;line-height:1.65;max-width:760px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:28px}.stage,.controls,.note{border:1px solid var(--line);background:rgba(20,27,49,.86);box-shadow:var(--shadow);border-radius:var(--radius)}.stage{padding:22px;min-height:520px;display:grid;place-items:center;overflow:auto}.controls{padding:20px;align-self:start;position:sticky;top:18px}.controls h2{font-size:1rem;margin:0 0 16px}.field{margin:0 0 18px}.field label{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}.segmented{display:grid;gap:8px}.segmented button,.pill{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}.segmented button:hover,.pill:hover{border-color:#6978aa}.segmented button[aria-pressed="true"],.pill.active{background:linear-gradient(135deg,var(--accent),#6978ff);color:#08101f;border-color:transparent;font-weight:800}.range{width:100%;accent-color:var(--accent)}.readout{padding:13px;border-radius:14px;background:#0e1428;color:var(--muted);line-height:1.5;font-size:.9rem}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6978ff);color:#07101f}.btn.secondary{background:#e9ecf7;color:#26304a}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn:focus-visible,.pill:focus-visible,.segmented button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.button-row{display:flex;gap:10px;flex-wrap:wrap}.chip{display:inline-flex;padding:6px 9px;border-radius:999px;background:#253053;color:#cbd2ef;font-size:.78rem;font-weight:750}.small{font-size:.86rem;color:var(--muted)}.footer-note{margin-top:24px;color:var(--muted);font-size:.85rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.controls{position:static;order:-1}.stage{min-height:430px}.topbar{align-items:flex-start;flex-direction:column}}
.button-demo{width:min(620px,100%);display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.button-stack{display:grid;gap:14px}.demo-btn{position:relative;min-height:52px;border-radius:13px;border:1px solid transparent;padding:0 18px;font-weight:850;cursor:pointer;transition:.16s}.demo-btn:hover{transform:translateY(-2px)}.demo-btn:focus-visible{outline:4px solid #54d2c6;outline-offset:4px}.demo-btn.primary{background:#7180ff;color:#07101f}.demo-btn.secondary{background:#e8ebf5;color:#26304a}.demo-btn.danger{background:#462534;color:#ffb5c0;border-color:#744052}.demo-btn.quiet{background:transparent;color:#d8def4;border-color:#43506f}.demo-btn.loading span{opacity:.5}.demo-btn i{display:none;width:18px;height:18px;border:3px solid rgba(7,16,31,.3);border-top-color:#07101f;border-radius:50%;animation:spin .7s linear infinite;position:absolute;left:calc(50% - 9px);top:calc(50% - 9px)}.demo-btn.loading i{display:block}.demo-btn:disabled{cursor:not-allowed;opacity:.48;transform:none}.status-card{background:#0e1428;border:1px solid var(--line);padding:18px;border-radius:16px;min-height:160px}.status-card p{color:var(--muted);line-height:1.55}@keyframes spin{to{transform:rotate(1turn)}}@media(max-width:620px){.button-demo{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="topbar"><div class="brand">Agent UI Lab</div><a class="back" href="../index.html">← 全部实验</a></div><header class="intro"><div class="eyebrow">Interactive UI Principle</div><h1>Button States</h1><p>按钮必须在鼠标、键盘、等待和不可用情境下都给出清楚反馈。</p></header><section class="layout"><div class="stage"><div class="button-demo"><div class="button-stack"><button class="demo-btn primary" id="primaryBtn"><span>Save changes</span><i aria-hidden="true"></i></button><button class="demo-btn secondary">Preview</button><button class="demo-btn danger">Delete project</button><button class="demo-btn quiet">Cancel</button></div><div class="status-card" aria-live="polite"><span class="chip">Live status</span><p id="buttonStatus">使用 Tab 键移动焦点，观察清晰的 Focus Ring。</p></div></div></div><aside class="controls"><h2>模拟状态</h2><div class="field segmented" id="buttonModes"><button aria-pressed="true" data-state="default">Default</button><button aria-pressed="false" data-state="loading">Loading</button><button aria-pressed="false" data-state="disabled">Disabled</button></div><div class="readout">按钮状态不仅是视觉变化，还需要明确系统是否接收了操作、是否仍可交互，以及用户下一步能做什么。</div></aside></section><p class="footer-note">提示：使用 Tab 键体验键盘焦点；所有实验均为无依赖单文件 HTML。</p></main><script>
const qs=(s,r=document)=>r.querySelector(s);const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
function setPressed(group,active){qsa('[aria-pressed]',group).forEach(b=>b.setAttribute('aria-pressed',String(b===active)))}
const p=qs('#primaryBtn'),status=qs('#buttonStatus');qs('#buttonModes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setPressed(qs('#buttonModes'),b);p.disabled=false;p.classList.remove('loading');if(b.dataset.state==='loading'){p.classList.add('loading');status.textContent='Loading：操作已被接收，按钮暂时避免重复提交，同时保持原尺寸。'}else if(b.dataset.state==='disabled'){p.disabled=true;status.textContent='Disabled：控件不可操作，但界面仍应在附近解释不可用原因。'}else{status.textContent='Default：使用 Tab 键移动焦点，观察清晰的 Focus Ring。'}});qsa('.demo-btn').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled&&!b.classList.contains('loading'))status.textContent='已触发：'+b.textContent.trim()}));</script></body></html>
