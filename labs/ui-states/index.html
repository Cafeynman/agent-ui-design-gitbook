<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="真实产品需要完整表达等待、空白、失败、成功和正常数据，而不是只画一张理想截图。"><title>UI States · Agent UI Lab</title><style>
:root{--bg:#0b1020;--panel:#141b31;--panel2:#1c2542;--text:#f4f6ff;--muted:#a8b1cc;--line:#33405f;--accent:#7c8cff;--accent2:#54d2c6;--danger:#ff7d8d;--warning:#ffc66d;--success:#63d69b;--radius:20px;--shadow:0 22px 70px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(124,140,255,.2),transparent 32%),radial-gradient(circle at 90% 20%,rgba(84,210,198,.12),transparent 30%),var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:34px 0 70px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.brand{font-weight:850;letter-spacing:-.03em}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--text)}.eyebrow{color:var(--accent2);font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1;letter-spacing:-.055em;margin:.35rem 0 1rem;max-width:900px}.intro p{color:var(--muted);font-size:1.05rem;line-height:1.65;max-width:760px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:28px}.stage,.controls,.note{border:1px solid var(--line);background:rgba(20,27,49,.86);box-shadow:var(--shadow);border-radius:var(--radius)}.stage{padding:22px;min-height:520px;display:grid;place-items:center;overflow:auto}.controls{padding:20px;align-self:start;position:sticky;top:18px}.controls h2{font-size:1rem;margin:0 0 16px}.field{margin:0 0 18px}.field label{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}.segmented{display:grid;gap:8px}.segmented button,.pill{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}.segmented button:hover,.pill:hover{border-color:#6978aa}.segmented button[aria-pressed="true"],.pill.active{background:linear-gradient(135deg,var(--accent),#6978ff);color:#08101f;border-color:transparent;font-weight:800}.range{width:100%;accent-color:var(--accent)}.readout{padding:13px;border-radius:14px;background:#0e1428;color:var(--muted);line-height:1.5;font-size:.9rem}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6978ff);color:#07101f}.btn.secondary{background:#e9ecf7;color:#26304a}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn:focus-visible,.pill:focus-visible,.segmented button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.button-row{display:flex;gap:10px;flex-wrap:wrap}.chip{display:inline-flex;padding:6px 9px;border-radius:999px;background:#253053;color:#cbd2ef;font-size:.78rem;font-weight:750}.small{font-size:.86rem;color:var(--muted)}.footer-note{margin-top:24px;color:var(--muted);font-size:.85rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.controls{position:static;order:-1}.stage{min-height:430px}.topbar{align-items:flex-start;flex-direction:column}}
.state-app{width:min(720px,100%);min-height:430px;background:#f8f9fd;color:#20283e;border-radius:20px;padding:25px}.state-app header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e5ef;padding-bottom:18px}.state-app h2{margin:8px 0 0}.state-app header button,.state-action{border:0;border-radius:10px;padding:10px 12px;background:#6677ff;color:#fff;font-weight:800}.state-view{min-height:300px;display:grid;place-items:center;text-align:center}.center-state{max-width:420px}.center-state .icon{width:60px;height:60px;border-radius:18px;background:#e4e8f6;display:grid;place-items:center;margin:0 auto 15px;font-size:1.5rem}.center-state h3{margin:0 0 8px}.center-state p{color:#6c7691;line-height:1.5}.error-state .icon{background:#fff0f2;color:#bd354b}.success-state .icon{background:#e6faf3;color:#13725a}.skeletons{width:100%;display:grid;gap:12px}.sk{height:70px;border-radius:14px;background:linear-gradient(90deg,#e7eaf2 25%,#f5f6fa 50%,#e7eaf2 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}.data-list{width:100%;display:grid;gap:10px;text-align:left}.row{display:grid;grid-template-columns:1fr auto;gap:15px;background:#e9ecf4;border-radius:12px;padding:14px}.row span{color:#6b7590;font-size:.82rem}@keyframes shimmer{to{background-position:-200% 0}}</style></head><body><main class="shell"><div class="topbar"><div class="brand">Agent UI Lab</div><a class="back" href="../index.html">← 全部实验</a></div><header class="intro"><div class="eyebrow">Interactive UI Principle</div><h1>UI States</h1><p>真实产品需要完整表达等待、空白、失败、成功和正常数据，而不是只画一张理想截图。</p></header><section class="layout"><div class="stage"><div class="state-app"><header><div><span class="chip">Research library</span><h2>Your evidence</h2></div><button>Add source</button></header><div id="stateView" class="state-view"><div class="skeletons" aria-label="正在加载"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></div></div><aside class="controls"><h2>切换页面状态</h2><div class="field segmented" id="states"><button aria-pressed="true" data-state="loading">Loading</button><button aria-pressed="false" data-state="empty">Empty</button><button aria-pressed="false" data-state="error">Error</button><button aria-pressed="false" data-state="success">Success</button><button aria-pressed="false" data-state="data">Data</button></div><div class="readout" id="stateExplain">Loading 应说明系统正在工作，并尽量保持布局稳定。</div></aside></section><p class="footer-note">提示：使用 Tab 键体验键盘焦点；所有实验均为无依赖单文件 HTML。</p></main><script>
const qs=(s,r=document)=>r.querySelector(s);const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
function setPressed(group,active){qsa('[aria-pressed]',group).forEach(b=>b.setAttribute('aria-pressed',String(b===active)))}
const view=qs('#stateView'),explain=qs('#stateExplain');const render={loading:()=>`<div class="skeletons" aria-label="正在加载"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`,empty:()=>`<div class="center-state"><div class="icon">＋</div><h3>No evidence yet</h3><p>Add your first source to begin building a traceable research library.</p><button class="state-action">Add first source</button></div>`,error:()=>`<div class="center-state error-state"><div class="icon">!</div><h3>We could not load your library</h3><p>Your connection may have been interrupted. Your saved sources are safe.</p><button class="state-action">Try again</button></div>`,success:()=>`<div class="center-state success-state"><div class="icon">✓</div><h3>Source added</h3><p>The document is being analyzed. You can continue working while it finishes.</p><button class="state-action">View source</button></div>`,data:()=>`<div class="data-list"><div class="row"><b>Market study 2026</b><span>Analyzed</span></div><div class="row"><b>Customer interviews</b><span>12 notes</span></div><div class="row"><b>Security review</b><span>Needs attention</span></div></div>`};const messages={loading:'Loading 应说明系统正在工作，并尽量保持布局稳定。',empty:'Empty 要解释为什么为空，并给出第一步行动。',error:'Error 要说明影响、保留情况和恢复方式。',success:'Success 要说明发生了什么，以及下一步在哪里。',data:'正常数据状态也需要清楚的层级、状态标签和主要行动。'};function show(s){view.innerHTML=render[s]();explain.textContent=messages[s]}qs('#states').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setPressed(qs('#states'),b);show(b.dataset.state)});show('loading');</script></body></html>
